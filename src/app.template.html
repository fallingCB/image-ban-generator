<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>禁止表情包生成器 · 拖入图片或 GIF</title>
<meta name="description" content="把图片或动图拖进来，它会替换掉牌子里的黄色奶龙，并自动加上红色禁止标志。动图进、动图出，全部在浏览器本地完成，不上传。">

<meta property="og:title" content="禁止表情包生成器">

<style>
  :root{
    --bg:#0f1116; --panel:#171a22; --panel2:#1e2230; --line:#2a3040;
    --txt:#e9edf5; --dim:#95a0b5; --accent:#4f8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 18% -8%,#1c2233 0%,var(--bg) 60%);
    color:var(--txt);font:14px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;

  header{padding:16px 22px 6px}
  h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
  header p{margin:5px 0 0;color:var(--dim);font-size:12.5px}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 340px;gap:16px;padding:14px 22px 26px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}

  #preview{display:block;width:100%;height:auto;cursor:grab;touch-action:none}

  .row{display:flex;gap:10px;align-items:center;margin:9px 0}

<body>
<header>

</main>

<script id="app-core">
/* ==== CORE:BEGIN ==== pure logic — median-cut quantiser + GIF89a LZW encoder */

/** Median-cut palette. samples: Uint8Array of RGB triples, length = 3 * count. */
function medianCutPalette(samples, maxColors) {
  const count = Math.floor(samples.length / 3);
  if (!count) return [[0, 0, 0]];
  const r = new Uint8Array(count), g = new Uint8Array(count), b = new Uint8Array(count);
  for (let i = 0; i < count; i++) {
    r[i] = samples[i * 3]; g[i] = samples[i * 3 + 1]; b[i] = samples[i * 3 + 2];
  }
  const boxes = [{ start: 0, end: count }];
  const stats = (box) => {
    let rmin = 255, rmax = 0, gmin = 255, gmax = 0, bmin = 255, bmax = 0;
    for (let i = box.start; i < box.end; i++) {
      const rv = r[i], gv = g[i], bv = b[i];
      if (rv < rmin) rmin = rv; if (rv > rmax) rmax = rv;
      if (gv < gmin) gmin = gv; if (gv > gmax) gmax = gv;
      if (bv < bmin) bmin = bv; if (bv > bmax) bmax = bv;
    }
    return { rmin, rmax, gmin, gmax, bmin, bmax, pri: Math.max(rmax - rmin, gmax - gmin, bmax - bmin) };
  };
  boxes[0] = Object.assign(boxes[0], stats(boxes[0]));

  while (boxes.length < maxColors) {
    let bi = -1, best = 0;
    for (let i = 0; i < boxes.length; i++) {
      const bx = boxes[i];
      const n = bx.end - bx.start;
      if (n < 2) continue;
      const score = bx.pri * Math.log2(n + 1);
      if (score > best) { best = score; bi = i; }
    }
    if (bi < 0 || best <= 0) break;
    const box = boxes[bi];
    const axis = (box.rmax - box.rmin >= box.gmax - box.gmin && box.rmax - box.rmin >= box.bmax - box.bmin)
      ? 0 : (box.gmax - box.gmin >= box.bmax - box.bmin ? 1 : 2);
    const chan = axis === 0 ? r : axis === 1 ? g : b;
    const order = [];
    for (let i = box.start; i < box.end; i++) order.push(i);
    order.sort((p, q) => chan[p] - chan[q]);
    // apply the permutation to all three channels
    const nr = new Uint8Array(order.length), ng = new Uint8Array(order.length), nb = new Uint8Array(order.length);
    for (let k = 0; k < order.length; k++) {
      const s = order[k];
      nr[k] = r[s]; ng[k] = g[s]; nb[k] = b[s];
    }
    for (let k = 0; k < order.length; k++) {
      const d = box.start + k;
      r[d] = nr[k]; g[d] = ng[k]; b[d] = nb[k];
    }
    const mid = box.start + (order.length >> 1);
    boxes[bi] = Object.assign({ start: box.start, end: mid }, stats({ start: box.start, end: mid }));
    boxes.push(Object.assign({ start: mid, end: box.end }, stats({ start: mid, end: box.end })));
  }

  return boxes.map((bx) => {
    let sr = 0, sg = 0, sb = 0, n = 0;
    for (let i = bx.start; i < bx.end; i++) { sr += r[i]; sg += g[i]; sb += b[i]; n++; }
    if (!n) return [0, 0, 0];
    return [Math.round(sr / n), Math.round(sg / n), Math.round(sb / n)];
  });
}

/**
 * GIF89a encoder (LZW, per-frame delays, one transparent index).
 * frames: [{ indices: Uint8Array, delayMs: number, transparent: boolean }]
 * palette: [[r,g,b], ...]; the transparent slot is palette.length (<= 255).
 */
function encodeGIF(o) {
  const width = o.width, height = o.height, frames = o.frames, palette = o.palette;
  // Growable byte buffer.  A plain array of numbers would cost ~8 bytes for every GIF
  // byte, which matters once the export reaches a few megabytes.
  let out = new Uint8Array(1 << 16), outLen = 0;
  let bitCount = 0;
  const byte = (v) => {
    if (outLen === out.length) {
      const bigger = new Uint8Array(out.length * 2);
      bigger.set(out);
      out = bigger;
    }
    out[outLen++] = v & 0xff;
  };
  const short = (v) => { byte(v & 0xff); byte((v >>> 8) & 0xff); };
  const str = (s) => { for (let i = 0; i < s.length; i++) byte(s.charCodeAt(i)); };

  // Frames that actually carry transparency get an extra palette slot only when the
  // colour table still has room; a 256-colour table cannot grow past the 8-bit field.
  const needsTransparency = frames.some((f) => f.transparent);
  let bits = 1;
  while ((1 << bits) < palette.length) bits++;
  // the minimum code size must also cover every index actually used
  let maxIndex = 0;
  for (const f of frames) {
    const idx = f.indices;
    for (let i = 0; i < idx.length; i++) if (idx[i] > maxIndex) maxIndex = idx[i];
  }
  while ((1 << bits) <= maxIndex) bits++;
  if ((1 << bits) < 2) bits = 1;
  if (bits > 8) bits = 8;                      // the table-size field is only 3 bits
  const tableSize = 1 << bits;
  // Transparent pixels use a slot that is not otherwise needed.  When the palette
  // already fills the table, reuse an existing colour instead of inventing an index.
  const spareSlot = needsTransparency && palette.length < tableSize ? palette.length : -1;
  const transparentIndex = spareSlot >= 0 ? spareSlot : Math.max(0, Math.min(255, maxIndex));
  // The LZW minimum code size is kept at the conventional 8 bits.  Decoders disagree
  // about code-width handling for smaller sizes, so every real-world encoder (and
  // Pillow) uses 8 whenever the colour table is that large; lzwBits tracks that.
  const lzwBits = 8;
  const clearCode = 1 << lzwBits, endCode = clearCode + 1, codeSize = lzwBits + 1;

  str('GIF89a');
  short(width); short(height);
  byte(0x80 | ((bits - 1) & 0x07));   // global colour table present
  byte(transparentIndex);             // background index
  byte(0);                            // pixel aspect ratio
  for (let i = 0; i < tableSize; i++) {
    const c = palette[i] || [0, 0, 0];
    byte(c[0]); byte(c[1]); byte(c[2]);
  }

  // NETSCAPE2.0 application extension, loop count 0: play forever.  Without it a viewer is
  // free to show the animation once and stop, which is not what a sticker should do.
  byte(0x21); byte(0xff); byte(11);
  str('NETSCAPE2.0');
  byte(3); byte(1); short(0);
  byte(0);

  for (const frame of frames) {
    // Transparency is only meaningful when a spare, unassigned slot exists.
    const useAlpha = !!(frame.transparent && spareSlot >= 0);
    byte(0x21); byte(0xf9); byte(4);           // graphic control extension
    byte(useAlpha ? 0x05 : 0x04);              // disposal=1 (+ transparency flag)
    short(Math.max(1, Math.round(frame.delayMs / 10)));
    byte(useAlpha ? transparentIndex : 0);     // transparent colour index (0 when unused)
    byte(0);

    byte(0x2c);                                // image descriptor
    short(0); short(0); short(width); short(height);
    byte(0);                                   // no local table, not interlaced

    byte(lzwBits);
    const data = [];
    let cur, pending = 0;
    // Standard GIF LZW.  The running sequence is held as the *code* it already has, so the
    // dictionary can be keyed by the integer (prefixCode << 8) | symbol instead of building
    // and joining a fresh array for every pixel - same output bytes, ~3x faster.
    //   next : the code the next new sequence will get (clear and EOI sit just above the
    //          colour table, so the single symbols are codes 0..255 and next starts at 258)
    // A decoder adds one table entry per code it has processed, so on each emission its
    // table holds next - 1 entries and it widens the moment that reaches 2^width.
    // writeCode applies the same rule before emitting.
    let dict, next;
    const resetDict = () => {
      dict = new Map();
      next = endCode + 1;
      cur = codeSize;
    };
    const writeCode = (code) => {
      if (next - 1 === (1 << cur) && cur < 12) cur++;
      for (let b = 0; b < cur; b++) {
        if (code & (1 << b)) pending |= (1 << bitCount);
        bitCount++;
        if (bitCount === 8) { data.push(pending & 0xff); pending = 0; bitCount = 0; }
      }
    };
    resetDict();
    writeCode(clearCode);
    const idx = frame.indices;
    let prefix = idx[0];
    for (let i = 1; i < idx.length; i++) {
      const k = idx[i];
      const key = (prefix << 8) | k;
      const hit = dict.get(key);
      if (hit !== undefined) { prefix = hit; continue; }   // extend the running sequence
      writeCode(prefix);
      if (next < 4096) {
        // The two slots above the table are clear + EOI, so a new sequence takes the
        // next free code - never one of those reserved slots.
        dict.set(key, next++);
      } else {
        // Dictionary is full: emit CLEAR and start a fresh block in lockstep.
        writeCode(clearCode);
        resetDict();
      }
      prefix = k;
    }
    writeCode(prefix);
    writeCode(endCode);
    if (bitCount > 0) { data.push(pending & 0xff); pending = 0; bitCount = 0; }

    for (let p = 0; p < data.length; p += 255) {
      const n = Math.min(255, data.length - p);
      byte(n);
      for (let i = 0; i < n; i++) byte(data[p + i]);
    }
    byte(0);                                   // block terminator
  }
  byte(0x3b);                                  // trailer
  return out.slice(0, outLen);
}
/* ==== CORE:END ==== */
</script>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);

  /* ---------- baked assets + measured sign geometry ---------- */
  const TEMPLATE_SRC = '__TEMPLATE_DATA_URI__';
  const OVERLAY_SRC = '__OVERLAY_DATA_URI__';
  const SLASHMASK_SRC = '__SLASHMASK_DATA_URI__';
  const THUMB_SRC = '__THUMB_DATA_URI__';
  // Baked in by tools/build_page.py from the same measurement that produced the assets.
  //   ring_in/out  - the red ring's inner/outer edge (median over 48 angles)
  //   cover_r      - the picture has to reach this far so no white gap is left in the sign
  //   clip_r       - the picture is clipped here, held inside the ring by the overlay
  //   disc_r       - how far the overlay's opaque board reaches
  const GEO = __GEO_JSON__;
  const BASE = GEO.w, H_BASE = GEO.h;
  const CX = GEO.cx, CY = GEO.cy;
  const COVER_R = GEO.cover_r, CLIP_R = GEO.clip_r, DISC_R = GEO.disc_r;
  const PREVIEW_W = 520;

  $('hintImg').src = THUMB_SRC;

  const baseCanvas = document.createElement('canvas');
  const userCanvas = document.createElement('canvas');
  let baseReady = false, overlayImg = null, slashMaskImg = null, overlayNoSlash = null;

  const src = { kind: 'none', img: null, w: 0, h: 0, frames: null, delays: null, animated: false, name: '' };
  const params = { scale: 1, dx: 0, dy: 0, rot: 0, stroke: 1, shadow: true, whiteBg: true, slash: true, size: 816 };

  const preview = $('preview');
  const pctx = preview.getContext('2d');
  const stage = $('stage');
  let previewData = null;

  baseCanvas.width = BASE; baseCanvas.height = H_BASE;

  function setStatus(t) { $('status').textContent = t || ''; }
  function setBar(p) {
    const bar = $('bar');
    if (p == null) { bar.style.display = 'none'; bar.firstElementChild.style.width = '0%'; return; }
    bar.style.display = 'block';
    bar.firstElementChild.style.width = Math.max(2, Math.min(100, p * 100)).toFixed(1) + '%';
  }
  function setMode(text) { $('modePill').textContent = text; }
  const nextFrame = () => new Promise((r) => setTimeout(r, 0));

  const baseLoaded = new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const c = baseCanvas.getContext('2d', { willReadFrequently: true });
      c.imageSmoothingQuality = 'high';
      c.drawImage(im, 0, 0, BASE, H_BASE);
      baseReady = true;
      res();
    };
    im.onerror = () => rej(new Error('内置模板加载失败'));
    im.src = TEMPLATE_SRC;
  });
  const overlayLoaded = new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { overlayImg = im; res(); };
    im.onerror = () => rej(new Error('内置禁止标志加载失败'));
    im.src = OVERLAY_SRC;
  });
  const slashMaskLoaded = new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { slashMaskImg = im; res(); };
    im.onerror = () => rej(new Error('内置斜杠蒙版加载失败'));
    im.src = SLASHMASK_SRC;
  });
  Promise.all([baseLoaded, overlayLoaded, slashMaskLoaded])
    .then(() => setStatus('准备就绪：拖入图片或 GIF 吧。'))
    .catch((e) => setStatus(String(e.message || e)));

  /** The overlay with the slash erased, for the "only keep the ring" option. */
  function overlaySans() {
    if (overlayNoSlash) return overlayNoSlash;
    const c = document.createElement('canvas');
    c.width = BASE; c.height = H_BASE;
    const x = c.getContext('2d');
    x.drawImage(overlayImg, 0, 0, BASE, H_BASE);
    const m = GEO.slash_mask;
    x.globalCompositeOperation = 'destination-out';
    x.drawImage(slashMaskImg, 0, 0, slashMaskImg.width, slashMaskImg.height, m.x, m.y, m.w, m.h);
    overlayNoSlash = c;
    return c;
  }

  /* ---------------- input handling ---------------- */
  async function decodeAnimation(blob) {
    const dec = new ImageDecoder({ data: await blob.arrayBuffer(), type: blob.type || 'image/gif' });
    // selectedTrack is null until the track list has been parsed - reading codedWidth
    // before tracks.ready resolves throws and kills every animated GIF.
    await dec.tracks.ready;
    const track = dec.tracks.selectedTrack;
    if (!track) throw new Error('这个动图没有可用的图像轨道');
    const n = track.frameCount;
    if (!n) throw new Error('这个动图没有可解码的帧');
    const canvas = document.createElement('canvas');
    canvas.width = track.codedWidth || track.displayWidth;
    canvas.height = track.codedHeight || track.displayHeight;
    const cx = canvas.getContext('2d', { willReadFrequently: true });
    const frames = [], delays = [];
    for (let i = 0; i < n; i++) {
      const { image } = await dec.decode({ frameIndex: i });
      const w = image.displayWidth || canvas.width, h = image.displayHeight || canvas.height;
      if (w !== canvas.width || h !== canvas.height) {
        canvas.width = w; canvas.height = h;
      }
      cx.drawImage(image, 0, 0);
      frames.push(cx.getImageData(0, 0, canvas.width, canvas.height));
      delays.push((image.duration || 100000) / 1000);
      try { image.close(); } catch (e) { /* ignore */ }
      setBar(0.35 * (i + 1) / n);
      setStatus('正在解码动图… ' + (i + 1) + '/' + n + ' 帧');
      if (i % 8 === 7) await nextFrame();
    }
    try { dec.close(); } catch (e) { /* ignore */ }
    return { frames, delays, w: canvas.width, h: canvas.height };
  }

  async function loadFile(file) {
    if (!file) return;
    $('bar').style.display = 'none';
    const isGif = /gif/i.test(file.type) || /\.gif$/i.test(file.name || '');
    const url = URL.createObjectURL(file);
    try {
      if (isGif && 'ImageDecoder' in window) {
        setStatus('正在读取动图…');
        const anim = await decodeAnimation(file);
        if (anim.frames.length > 1 || (anim.frames.length === 1 && anim.w > 1)) {
          if (anim.frames.length > 1) {
            src.kind = 'anim'; src.animated = true;
            src.frames = anim.frames; src.delays = anim.delays;
            src.w = anim.w; src.h = anim.h;
            src.img = null;
            src.name = (file.name || 'anim').replace(/\.[^.]+$/, '');
            userCanvas.width = src.w; userCanvas.height = src.h;
            previewData = src.frames[0];
            setMode('动图 · ' + anim.frames.length + ' 帧');
            adoptSource();
            setStatus('动图已就绪（' + anim.frames.length + ' 帧，' + src.w + '×' + src.h +
                      '）。微调位置后点“下载表情包”，会导出同样帧数的 GIF。');
            setBar(null);
            return;
          }
        }
        setStatus('这是一个单帧 GIF，按静态图处理。');
      }
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => rej(new Error('图片解码失败（格式可能不受支持）'));
        i.src = url;
      });
      src.kind = 'static'; src.img = img; src.animated = false;
      src.frames = null; src.delays = null;
      src.w = img.naturalWidth; src.h = img.naturalHeight;
      src.name = (file.name || 'image').replace(/\.[^.]+$/, '');
      userCanvas.width = src.w; userCanvas.height = src.h;
      const uc = userCanvas.getContext('2d', { willReadFrequently: true });
      uc.clearRect(0, 0, src.w, src.h);
      uc.drawImage(img, 0, 0);
      previewData = uc.getImageData(0, 0, src.w, src.h);
      setMode('静态图 ' + src.w + '×' + src.h);
      adoptSource();
      setStatus('图片已就绪（' + src.w + '×' + src.h + '）。拖动预览可以微调位置。');
    } catch (err) {
      setStatus('读取失败：' + (err && err.message ? err.message : err));
      console.error(err);
    } finally {
      URL.revokeObjectURL(url);
      setBar(null);
    }
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function fitScale() {
    // The picture is clipped to a circle of radius CLIP_R, but it only has to reach
    // COVER_R - the overlay hides everything between the two.  Nothing is visible outside
    // that circle, so the *shortest* side is what has to span it; a portrait or a pano
    // therefore needs a bigger scale than its long side alone would suggest.
    const shortest = Math.max(1, Math.min(src.w, src.h));
    return clamp(2 * COVER_R / shortest, 0.02, 5);
  }

  function adoptSource() {
    $('dropIdle').style.display = 'none';
    stage.style.display = 'block';
    $('download').disabled = false;
    $('fit').disabled = false;
    $('pick').disabled = false;
    params.scale = fitScale();
    params.dx = 0; params.dy = 0; params.rot = 0;
    $('scale').value = params.scale;
    $('dx').value = 0; $('dy').value = 0; $('rot').value = 0;
    if (src.animated && src.frames && src.frames.length > 1) startAnim(); else stopAnim();
    syncLabels(); updateInfo(); scheduleRender();
  }

  function updateInfo() {
    if (src.kind === 'none') { $('info').textContent = ''; return; }
    const bits = ['素材 ' + src.w + '×' + src.h];
    if (src.animated) bits.push('动图 ' + src.frames.length + ' 帧');
    bits.push('输出 ' + params.size + '×' + Math.round(params.size * GEO.h / GEO.w));
    bits.push(src.animated ? 'GIF' : 'PNG');
    $('info').textContent = bits.join(' · ');
  }

  /* ---------------- rendering ---------------- */
  /** Pure placement math: where the picture lands, in output pixels. */
  function computePlacement(size, srcW, srcH, p) {
    const k = size / BASE;
    const scale = Math.max(0.02, p.scale);       // sources can be far larger than the sign
    const dw = srcW * scale * k;
    const dh = srcH * scale * k;
    return {
      k,
      dw, dh,
      x: (CX + p.dx) * k - dw / 2,
      y: (CY + p.dy) * k - dh / 2,
      rot: p.rot * Math.PI / 180,
      clipRadius: CLIP_R * k,
      coverRadius: COVER_R * k,
      coverDiameter: 2 * COVER_R * k,
      coversCircle: Math.min(dw, dh) >= 2 * COVER_R * k - 0.5,
    };
  }

  function sizeFor() {
    const m = Math.max(src.w, src.h);
    const w = m * params.scale;
    return { w, h: w * src.h / src.w };
  }

  const scratch = document.createElement('canvas');

  function paint(ctx, w, h, px) {
    const k = w / BASE;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(baseCanvas, 0, 0, w, h);
    if (!px || !overlayImg) return;

    scratch.width = px.width; scratch.height = px.height;
    const sc = scratch.getContext('2d');
    sc.clearRect(0, 0, px.width, px.height);
    sc.putImageData(px, 0, 0);

    const s = sizeFor();
    const dw = s.w * k, dh = s.h * k;
    const ccx = CX * k, ccy = CY * k;

    ctx.save();
    ctx.beginPath();
    ctx.arc(ccx, ccy, CLIP_R * k, 0, Math.PI * 2);
    ctx.clip();
    if (params.shadow && params.stroke > 0.01) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,0.98)';
      ctx.shadowBlur = Math.max(2, 26 * params.stroke * k);
      for (let i = 0; i < 3; i++) {
        ctx.drawImage(scratch, 0, 0, px.width, px.height,
          ccx + params.dx * k - dw / 2, ccy + params.dy * k - dh / 2, dw, dh);
      }
      ctx.restore();
    }
    ctx.translate(ccx + params.dx * k, ccy + params.dy * k);
    ctx.rotate(params.rot * Math.PI / 180);
    ctx.drawImage(scratch, 0, 0, px.width, px.height, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();

    if (!params.stroke && !params.slash) return;
    // The overlay carries the ring, the slash and the board just outside the ring, so it
    // covers the picture's clipped edge no matter how the picture is placed.
    const ov = params.slash ? overlayImg : overlaySans();
    ctx.save();
    ctx.beginPath();
    ctx.arc(ccx, ccy, DISC_R * k, 0, Math.PI * 2);
    ctx.clip();
    if (params.shadow) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,0.92)';
      ctx.shadowBlur = Math.max(1, 14 * params.stroke * k);
      ctx.drawImage(ov, 0, 0, w, h);
      ctx.restore();
    }
    ctx.drawImage(ov, 0, 0, w, h);
    ctx.restore();
  }

  let renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderPreview(); });
  }

  /* ---------------- animated preview ---------------- */
  // The preview shows the animation, not just frame 0, so what you tune is what you get.
  let animTimer = null, animIndex = 0;

  function animFrameData() {
    if (src.animated && src.frames && src.frames.length) {
      return src.frames[animIndex % src.frames.length];
    }
    return previewData;
  }

  function stopAnim() {
    if (animTimer !== null) { clearTimeout(animTimer); animTimer = null; }
    animIndex = 0;
  }

  function startAnim() {
    stopAnim();
    if (!src.animated || !src.frames || src.frames.length < 2) return;
    const tick = () => {
      animTimer = null;
      animIndex = (animIndex + 1) % src.frames.length;
      // Paint straight away rather than through scheduleRender's requestAnimationFrame:
      // the frame is already paced by its own delay, and rAF is throttled (or absent) when
      // the page is not compositing, which would silently freeze the preview.
      renderPreview();
      // honour the frame's own delay, so the preview runs at the exported speed
      animTimer = setTimeout(tick, Math.max(20, src.delays[animIndex] || 100));
    };
    animTimer = setTimeout(tick, Math.max(20, src.delays[0] || 100));
  }

  function renderPreview() {
    if (!baseReady || src.kind === 'none') return;
    const w = PREVIEW_W, h = Math.round(PREVIEW_W * GEO.h / GEO.w);
    if (preview.width !== w || preview.height !== h) { preview.width = w; preview.height = h; }
    paint(pctx, w, h, animFrameData());
  }

  async function renderFull(size, px) {
    const w = size, h = Math.round(size * GEO.h / GEO.w);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    paint(c.getContext('2d'), w, h, px);
    return c;
  }

  /* ---------------- controls ---------------- */
  // Panning is deliberately unbounded: dragging never hits a wall, and the two sliders grow
  // to follow wherever the drag went so they can still bring the picture back.
  const PAN_MIN_RANGE = 200;
  function syncPanRange() {
    const reach = Math.max(Math.abs(params.dx), Math.abs(params.dy), PAN_MIN_RANGE);
    const span = Math.ceil(reach / 100) * 100;
    for (const id of ['dx', 'dy']) {
      const el = $(id);
      if (Number(el.max) < span) { el.min = String(-span); el.max = String(span); }
      el.value = String(id === 'dx' ? params.dx : params.dy);
    }
  }

  function syncLabels() {
    $('scaleV').textContent = params.scale.toFixed(2) + '×';
    $('dxV').textContent = Math.round(params.dx);
    $('dyV').textContent = Math.round(params.dy);
    $('rotV').textContent = Math.round(params.rot) + '°';
    $('strokeV').textContent = params.stroke.toFixed(2) + '×';
    $('outSizeV').textContent = params.size;
    $('fpsV').textContent = $('fps').value;
    $('maxFramesV').textContent = $('maxFrames').value;
    $('colorsV').textContent = $('colors').value;
  }

  const bind = (id, key, after) => $(id).addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    if (key) params[key] = v;
    if (after) after(v);
    syncLabels(); scheduleRender();
  });
  bind('scale', 'scale');
  bind('dx', 'dx');
  bind('dy', 'dy');
  bind('rot', 'rot');
  bind('stroke', 'stroke');
  bind('outSize', 'size', updateInfo);
  bind('fps', null);
  bind('maxFrames', null);
  bind('colors', null);
  $('shadow').addEventListener('change', (e) => { params.shadow = e.target.checked; scheduleRender(); });
  $('whiteBg').addEventListener('change', (e) => { params.whiteBg = e.target.checked; });
  $('keepSlash').addEventListener('change', (e) => { params.slash = e.target.checked; scheduleRender(); });

  $('fit').addEventListener('click', () => {
    if (src.kind === 'none') return;
    params.dx = 0; params.dy = 0; params.rot = 0;
    params.scale = fitScale();
    $('dx').value = 0; $('dy').value = 0; $('rot').value = 0; $('scale').value = params.scale;
    syncLabels(); scheduleRender();
  });

  /* ---------------- drag & drop / paste ---------------- */
  const drop = $('drop');
  let dragDepth = 0;
  document.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; drop.classList.add('hot'); });
  document.addEventListener('dragover', (e) => { e.preventDefault(); });
  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) drop.classList.remove('hot');
  });
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0; drop.classList.remove('hot');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items) {
      if (it.kind === 'file') {
        const f = it.getAsFile();
        if (f) { e.preventDefault(); loadFile(f); break; }
      }
    }
  });
  drop.addEventListener('click', () => {
    // A pan ends with a click on the canvas underneath; that must not pop the file picker.
    if (swallowClick) { swallowClick = false; return; }
    $('file').click();
  });
  $('pick').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    loadFile(f);
  });

  /* ---------------- pan / zoom on the preview ---------------- */
  let dragging = null;
  let dragMoved = false;      // did this gesture actually pan, or was it just a click?
  let swallowClick = false;   // ... if it panned, the click that ends it must not open the picker
  preview.addEventListener('pointerdown', (e) => {
    if (src.kind === 'none') return;
    dragging = { x: e.clientX, y: e.clientY, dx: params.dx, dy: params.dy };
    dragMoved = false;
    try { preview.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    preview.classList.add('drag');
  });
  preview.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    // The canvas is stretched to the panel width, so the CSS pixels the pointer reports
    // have to be converted through the element's real size, not the bitmap's.
    const cssW = preview.getBoundingClientRect().width || preview.width;
    const k = BASE / cssW;
    if (Math.abs(e.clientX - dragging.x) + Math.abs(e.clientY - dragging.y) > 4) dragMoved = true;
    // no clamp: the picture may be pushed as far as the pointer goes
    params.dx = dragging.dx + (e.clientX - dragging.x) * k;
    params.dy = dragging.dy + (e.clientY - dragging.y) * k;
    syncPanRange();
    syncLabels(); scheduleRender();
  });
  ['pointerup', 'pointercancel'].forEach((ev) => preview.addEventListener(ev, () => {
    if (dragging && dragMoved) {
      swallowClick = true;
      setTimeout(() => { swallowClick = false; }, 400);   // in case no click follows
    }
    dragging = null; preview.classList.remove('drag');
  }));
  preview.addEventListener('wheel', (e) => {
    if (src.kind === 'none') return;
    e.preventDefault();
    params.scale = clamp(params.scale * (e.deltaY > 0 ? 0.94 : 1.06), 0.2, 5);
    $('scale').value = params.scale;
    syncLabels(); scheduleRender();
  }, { passive: false });

  /* ---------------- export ---------------- */
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  }

  function canvasToBlob(c, type) {
    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('导出失败'))), type));
  }

  async function exportStatic() {
    const c = await renderFull(params.size, previewData);
    const blob = await canvasToBlob(c, 'image/png');
    download(blob, (src.name || 'ban') + '-禁止.png');
  }

  async function exportGif() {
    const size = params.size;
    const maxFrames = parseInt($('maxFrames').value, 10);
    const maxColors = parseInt($('colors').value, 10);
    const w = size, h = Math.round(size * GEO.h / GEO.w);
    const renderer = document.createElement('canvas');
    renderer.width = w; renderer.height = h;
    const rctx = renderer.getContext('2d', { willReadFrequently: true });

    // Which source frames get exported, and how long each one shows.  Dropping frames
    // merges their delays, so the animation keeps its original duration.
    const total = src.frames.length;
    const step = total > maxFrames ? Math.ceil(total / maxFrames) : 1;
    const picks = [];
    for (let i = 0; i < total; i += step) picks.push(i);
    const delays = picks.map((i) => {
      let ms = 0;
      for (let k = i; k < Math.min(i + step, total); k++) ms += src.delays[k] || 0;
      return ms || src.delays[i] || 100;
    });

    // Pass 1 - colour samples.  They are spread across every exported frame rather than
    // filling up on the first one, so a GIF whose colours change midway still quantises well.
    const perFrame = Math.max(800, Math.floor(45000 / picks.length));
    const sample = new Uint8Array(perFrame * picks.length * 3);
    const sampleStep = Math.max(1, Math.floor((w * h) / perFrame));
    let si = 0;
    for (let f = 0; f < picks.length; f++) {
      paint(rctx, w, h, src.frames[picks[f]]);
      const d = rctx.getImageData(0, 0, w, h).data;
      for (let p = 0; p < d.length && si + 3 <= sample.length; p += 4 * sampleStep) {
        sample[si++] = d[p]; sample[si++] = d[p + 1]; sample[si++] = d[p + 2];
      }
      setBar(0.42 * (f + 1) / picks.length);
      setStatus('正在渲染并取色 ' + (f + 1) + '/' + picks.length + ' 帧…');
      if (f % 8 === 7) await nextFrame();
    }

    setStatus('正在生成调色板…');
    await nextFrame();
    const palette = medianCutPalette(sample.subarray(0, si - (si % 3)), maxColors);
    if (!palette.length) throw new Error('调色板生成失败');

    const cache = new Int16Array(32768).fill(-1);
    const findNearest = (r, g, b) => {
      const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
      const hit = cache[key];
      if (hit >= 0) return hit;
      let bi = 0, bd = Infinity;
      for (let i = 0; i < palette.length; i++) {
        const c = palette[i];
        const dr = r - c[0], dg = g - c[1], db = b - c[2];
        const dist = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
        if (dist < bd) { bd = dist; bi = i; }
      }
      cache[key] = bi;
      return bi;
    };

    // Pass 2 - paint each frame again and quantise straight into an index frame.  Holding
    // the rendered RGBA of every frame costs 4 bytes per pixel per frame (348 MB for 150
    // frames at full size); one index byte per pixel is enough now that the palette is final.
    const outFrames = [];
    // Must stay inside 0..255 because it is written into a Uint8Array.
    const transparentIndex = Math.min(palette.length, 255);
    for (let f = 0; f < picks.length; f++) {
      paint(rctx, w, h, src.frames[picks[f]]);
      const d = rctx.getImageData(0, 0, w, h).data;
      const idx = new Uint8Array(w * h);
      let hasAlpha = false;
      for (let p = 0, q = 0; p < d.length; p += 4, q++) {
        const a = d[p + 3];
        if (a < 8) { idx[q] = transparentIndex; hasAlpha = true; continue; }
        let r = d[p], g = d[p + 1], b = d[p + 2];
        if (params.whiteBg && a < 250) {
          const f2 = a / 255;
          r = Math.round(r * f2 + 255 * (1 - f2));
          g = Math.round(g * f2 + 255 * (1 - f2));
          b = Math.round(b * f2 + 255 * (1 - f2));
        }
        idx[q] = findNearest(r, g, b);
      }
      outFrames.push({ indices: idx, delayMs: delays[f], transparent: hasAlpha });
      setBar(0.48 + 0.42 * (f + 1) / picks.length);
      setStatus('正在量化第 ' + (f + 1) + '/' + picks.length + ' 帧…');
      if (f % 4 === 3) await nextFrame();
    }

    setStatus('正在编码 GIF…');
    await nextFrame();
    const gif = encodeGIF({ width: w, height: h, frames: outFrames, palette });
    setBar(1);
    download(new Blob([gif], { type: 'image/gif' }), (src.name || 'ban') + '-禁止.gif');
    setStatus('已导出 ' + (gif.length / 1024).toFixed(0) + ' KB 的 GIF（' + outFrames.length + ' 帧，' +
              w + '×' + h + '）。');
    setTimeout(() => setBar(null), 1500);
  }

  $('download').addEventListener('click', async () => {
    if (src.kind === 'none') return;
    const btn = $('download');
    btn.disabled = true;
    try {
      if (src.animated) {
        await exportGif();
      } else {
        setStatus('正在生成 PNG…');
        await nextFrame();
        await exportStatic();
        setStatus('已导出 PNG（' + params.size + '×' + Math.round(params.size * GEO.h / GEO.w) + '）。');
      }
    } catch (err) {
      setStatus('导出失败：' + (err && err.message ? err.message : err));
      console.error(err);
    } finally {
      btn.disabled = false;
      setBar(null);
    }
  });

  syncLabels();
  window.addEventListener('resize', scheduleRender);
  // exposed for debugging / automated verification
  window.__banApp = {
    params, src, renderFull, paint, computePlacement, fitScale, adoptSource,
    overlaySans, GEO, BASE, H_BASE, medianCutPalette, encodeGIF,
    startAnim, stopAnim, animFrameData, preview,
    animState: () => ({ index: animIndex, running: animTimer !== null }),
  };
})();
</script>
</body>
</html>
